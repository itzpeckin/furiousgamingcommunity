name: FranchiseHQ Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - codex/franchisehq-*

permissions:
  contents: read

concurrency:
  group: franchisehq-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run FranchiseHQ baseline gate
        run: npm run ci
